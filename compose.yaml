# Production: the released image behind an existing Traefik (entrypoint websecure, external network `traefik`). Dev
# runs with `go run` + `npm run dev` instead (README).
#
#   docker compose pull && docker compose up -d --remove-orphans
#
# --remove-orphans: a container of a service this file no longer names would keep running on the same ./data.
#
# No port is published: Traefik reaches the container on the shared `traefik` network. The host comes from .env only:
# without PUBLIC_FQDN every compose command refuses to run. .env holds only what differs from the defaults (README,
# "Running it"); .env.example lists every variable, copy a line from it to change one.
services:
  trakk:
    # Every release moves latest: the command above updates.
    image: ghcr.io/trick77/trakk:latest
    restart: unless-stopped
    # Docker's default 10 s is shorter than Trakk's shutdown (HTTP drain, the event writer's tail, the counter
    # flush: at most 30 s, cmd/server shutdownBudget); a kill before it ends loses queued events and counters.
    stop_grace_period: 35s
    # distroless nonroot's own uid, never 1000 (the host's first user). Host ./data must belong to it, ./conf be
    # readable by it: sudo chown -R 65532:65532 data conf
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # BACKEND_* and PUBLIC_FQDN reach the container as they are.
    env_file: .env
    healthcheck:
      # Exec form: distroless has no shell.
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # ./data is what Trakk writes: app.db, the reference data cache (ref/) and session.secret when
    # BACKEND_SESSION_SECRET is empty. ./conf is what the operator writes, read-only inside: sites.json, the sites
    # Trakk collects for, and notify.json, the alert rules and channels (README).
    volumes:
      - ./data:/data
      - ./conf:/conf:ro
    expose:
      - "8080"
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # BACKEND_ADDR's port: change both together.
      traefik.http.services.trakk.loadbalancer.server.port: "8080"
      # The whole host: the collector under /api, the dashboard under /dashboard. The app mounts both itself, no
      # strip middleware.
      traefik.http.routers.trakk.rule: Host(`${PUBLIC_FQDN:?set PUBLIC_FQDN in .env, the hostname Traefik routes Trakk on}`)
      traefik.http.routers.trakk.entrypoints: websecure
      # No certresolver: the server's Traefik picks the certificate (a wildcard for its own subdomains) and
      # redirects its `web` entrypoint to `websecure` for every host, so no http router here.
      traefik.http.routers.trakk.tls: "true"
      traefik.http.routers.trakk.middlewares: trakk-compress
      traefik.http.middlewares.trakk-compress.compress: "true"
      com.centurylinklabs.watchtower.enable: "false"
      diun.enable: "false"

networks:
  traefik:
    external: true
