<!--
  Source for an apple-touch-icon. Not shipped: ui/icons/ is outside Vite's
  publicDir, so nothing here is copied into the bundle, and no PNG is made
  from it yet (iOS takes only a raster apple-touch-icon).

  Two things iOS forces that the transparent icon.svg cannot give it:

  1. An opaque ground. iOS composites an apple-touch-icon onto pure black
     before masking it, so a transparent one ships as a black square. #1f1f1e
     is the app's own bg token, which is what that flattening should produce.
  2. Square corners. iOS applies its own superellipse mask; rounding the
     corners of the tile would double-round them. The chip inside keeps its
     rx 4: those corners are the mark's own and are meant to be seen.

  The chip is smaller than in icon.svg (60 % vs 100 %) because it sits inside
  a tile with its own edges to breathe against. Same four redrawn strokes,
  same 3.0-unit weight, same inner scale and true-bbox centring as
  ../public/icon.svg; see that file for the derived transform formulas. This
  file's coverage C is 0.60: outer scale 64*0.6/18 = 2.13333, translate
  32 - 12*2.13333 = 6.4.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <rect width="64" height="64" fill="#1f1f1e"/>
  <g transform="translate(6.4000 6.4000) scale(2.13333)">
    <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#og)"/>
    <g transform="translate(5.2114 5.2114) scale(0.565714)" fill="none" stroke="#1f1f1e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3v16a2 2 0 0 0 2 2h16"/>
      <path d="M18 17V9"/>
      <path d="M13 17V5"/>
      <path d="M8 17v-3"/>
    </g>
  </g>
</svg>
